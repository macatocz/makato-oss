name: Validate PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check root structure
        run: ./scripts/check-root-structure.sh

      - name: Check skill frontmatter
        run: |
          for skill_dir in plugins/*/skills/*/; do
            if [ -d "$skill_dir" ]; then
              ./scripts/check-skill-frontmatter.sh "$skill_dir"
            fi
          done

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if ! echo "$TITLE" | grep -qE '^(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)\([a-z0-9-]+\): .+$'; then
            echo "::error::PR title must follow conventional commits: type(scope): description"
            echo "  Types: feat, fix, docs, refactor, test, chore, ci, build, perf, style, revert"
            echo "  Scope: area (docs, src, repo)"
            echo "  Got: $TITLE"
            exit 1
          fi

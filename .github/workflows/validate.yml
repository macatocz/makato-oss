name: Validate PR

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - 'infra/**'
      - 'tests/integration/**'
      - 'tests/infra/**'
      - '.github/scripts/**'
      - '.github/workflows/validate.yml'
      - '.github/workflows/project-board-sync.yml'
      - 'docs/assets/makato-flow.html'
      - 'docs/assets/makato-flow.data.json'
      - 'docs/assets/makato-flow.inventory.json'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - 'infra/**'
      - 'tests/integration/**'
      - 'tests/infra/**'
      - '.github/scripts/**'
      - '.github/workflows/validate.yml'
      - '.github/workflows/project-board-sync.yml'
      - 'docs/assets/makato-flow.html'
      - 'docs/assets/makato-flow.data.json'
      - 'docs/assets/makato-flow.inventory.json'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install pytest + jsonschema
        run: python3 -m pip install --quiet pytest jsonschema pyyaml

      - name: Check root structure
        run: ./scripts/check-root-structure.sh

      - name: Check skill frontmatter
        run: |
          for skill_dir in plugins/*/skills/*/; do
            if [ -d "$skill_dir" ]; then
              ./scripts/check-skill-frontmatter.sh "$skill_dir"
            fi
          done

      - name: Check plugin structure (AGENTS.md ≤200 lines, required files)
        run: |
          rc=0
          for plugin_dir in plugins/*/; do
            if [ -d "$plugin_dir" ]; then
              ./scripts/check-plugin-structure.sh "$plugin_dir" || rc=1
            fi
          done
          exit $rc

      - name: plan-tier classifier smoke tests (#211)
        run: ./.github/scripts/classify-plan-tier-smoke-tests.sh

      - name: plan-body promotion guard smoke tests (#212)
        run: ./plugins/makato-orchestrate/scripts/tests/validate-plan-body-smoke-tests.sh

      - name: HALT-006 auto-materialize gate smoke tests (#200)
        run: ./plugins/makato-orchestrate/scripts/tests/should-materialize-spec-smoke-tests.sh

      - name: seed-issue lightweight-lane smoke tests (#212)
        run: ./plugins/makato-orchestrate/skills/seed-issue/references/lightweight-lane-smoke-tests.sh

      - name: to-issues v2.0-schema smoke tests (#228)
        run: ./plugins/makato-plan/skills/to-issues/references/fixtures/v2-schema-smoke-tests.sh

      - name: Finding-schema contract smoke test (#230)
        run: ./plugins/makato-build/shared/finding-schema-smoke-test.sh

      - name: gate-scout hook-commands smoke tests (#450)
        run: ./plugins/makato-build/shared/gate-scout-hook-commands-smoke-tests.sh

      - name: makato-build runtime path smoke tests
        run: ./plugins/makato-build/shared/runtime-path-smoke-tests.sh

      - name: build-verify gate-commands smoke tests (#450)
        run: ./plugins/makato-build/shared/build-verify-gate-commands-smoke-tests.sh

      - name: loop smoke tests (#231/#232)
        run: ./plugins/makato-orchestrate/scripts/tests/loop-smoke-tests.sh

      - name: kill-switch poll and record-budget smoke tests (#706)
        run: ./plugins/makato-orchestrate/scripts/tests/kill-switch-smoke-tests.sh

      - name: loop change-dispatch integration tests (#717)
        run: ./plugins/makato-orchestrate/scripts/tests/loop-change-dispatch-integration-tests.sh

      - name: write-promote-lessons end-to-end integration tests (#719)
        run: ./tests/integration/write-promote-lessons-e2e.sh

      - name: loop HALT notifier smoke tests
        run: ./plugins/makato-orchestrate/scripts/tests/loop-halt-watch-smoke-tests.sh

      - name: dependency-aware promote-ready smoke tests (#268)
        run: ./plugins/makato-orchestrate/scripts/tests/promote-ready-smoke-tests.sh

      - name: workflow-state smoke tests (#173/#284/#317/#347)
        run: ./plugins/makato-orchestrate/skills/workflow-state/references/smoke-tests.sh

      - name: Python port unit tests (pytest — sync-living-specs, mark-ac, generate-progress/quality-doc, emit-needs-planning/reshape, lesson-prune)
        run: python3 -m pytest plugins/makato-orchestrate/scripts/tests/ -q

      - name: append-only conflict union-merge smoke tests (resolve-pr-conflict)
        run: ./plugins/makato-orchestrate/scripts/tests/resolve-append-only-conflict-smoke-tests.sh

      - name: workflow-schema-loader smoke tests (makato-build)
        run: ./plugins/makato-build/scripts/tests/workflow-schema-smoke-tests.sh

      - name: build-explore skill smoke tests (makato-build)
        run: ./plugins/makato-build/scripts/tests/build-explore-smoke-tests.sh

      - name: manage-stores smoke tests (makato-plan)
        run: ./plugins/makato-plan/scripts/tests/manage-stores-smoke-tests.sh

      - name: manage-stores skill-integration tests (makato-plan)
        run: ./plugins/makato-plan/scripts/tests/manage-stores-skill-tests.sh

      - name: to-issues cross-repo smoke tests (makato-plan)
        run: ./plugins/makato-plan/scripts/tests/to-issues-cross-repo-smoke-tests.sh

      - name: harness-audit smoke tests (makato-contribute)
        run: ./plugins/makato-contribute/scripts/tests/harness-audit-smoke-tests.sh

      - name: makato-flow diagram drift check (#428)
        run: python3 scripts/generate-flow-diagram.py --check

      - name: makato-flow generator unit tests (#428)
        run: python3 -m unittest scripts.test_generate_flow_diagram -v

  macos-compat:
    # local-openai-gpt-macos-compatibility (Task 5): macOS/Apple Silicon
    # compatibility job. Uses the GitHub-hosted macos-latest runner and its
    # already-provisioned tools only (no new tooling is installed). Runs
    # fully offline/mocked — no live provider network call, no credential.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install pytest + optional test dependencies
        run: python3 -m pip install --quiet pytest jsonschema pyyaml langfuse defusedxml

      - name: Python unit tests (pytest)
        run: python3 -m pytest -q

      - name: model-profiles resolver — structural validation for every profile
        run: |
          for profile in openai qwen-vllm apple-ollama; do
            python3 scripts/resolve-model-profile.py "$profile" --emit summary
          done

      - name: select-model-profile.sh --dry-run for every profile
        run: |
          for profile in openai qwen-vllm apple-ollama; do
            bash scripts/select-model-profile.sh "$profile" --dry-run
          done

      - name: macos-setup.sh --dry-run (tool + profile readiness report)
        run: bash scripts/macos-setup.sh --dry-run

      - name: preflight-model-runtime.sh — qwen-vllm profile (offline, mocked endpoint)
        run: |
          mkdir -p "$RUNNER_TEMP/omp"
          cat > "$RUNNER_TEMP/omp/models.yml" <<'EOF'
          providers:
            local:
              models:
                - id: open
                  contextWindow: 65536
                  maxTokens: 8192
          EOF
          cat > "$RUNNER_TEMP/omp/config.yml" <<'EOF'
          modelRoles:
            default: local/open
            task: local/open
            smol: local/open
            tiny: local/open
            plan: local/open
            advisor: local/open
            designer: local/open
            commit: local/open
            slow: local/open
            vision: local/open
          tools:
            format: qwen3
          EOF
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/curl" <<'EOF'
          #!/usr/bin/env bash
          echo '{"data":[{"id":"open","max_model_len":65536}]}'
          EOF
          chmod +x "$RUNNER_TEMP/bin/curl"
          PATH="$RUNNER_TEMP/bin:$PATH" \
            OMP_MODELS_FILE="$RUNNER_TEMP/omp/models.yml" \
            OMP_CONFIG_FILE="$RUNNER_TEMP/omp/config.yml" \
            MAKATO_SKIP_OPTIONAL_PREFLIGHT=1 \
            bash scripts/preflight-model-runtime.sh

      - name: preflight-optional-services.sh — offline (no services configured)
        run: SAGIBEAST_SSH_CONFIG=/dev/null bash scripts/preflight-optional-services.sh

      - name: infra bootstrap-vllm.sh — refuses to run on Darwin
        run: |
          set +e
          bash infra/bootstrap-vllm.sh
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "::error::bootstrap-vllm.sh must refuse to run on Darwin"; exit 1; }

      - name: infra vllm-serve.sh — refuses to run on Darwin
        run: |
          set +e
          bash infra/vllm-serve.sh
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "::error::vllm-serve.sh must refuse to run on Darwin"; exit 1; }

      - name: macOS/remote-profile matrix smoke tests (#Task 5)
        run: bash tests/infra/test_macos_remote_profiles.sh --verbose

      - name: harness-independence infra smoke tests (extended, #Task 5)
        run: bash tests/infra/test_harness_independence_infra.sh --verbose

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit title
        env:
          # Pass through env var so the title cannot inject shell.
          # See actionlint expression security warning.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Conventional commit — `type(scope): description` with scope
          # OPTIONAL. AGENTS.md § *Cross-cutting changes* explicitly says
          # the scope is omitted for repo-wide changes (`.github/`,
          # `CHANGELOG.md`, root `README.md`, `scripts/`); release-please
          # also emits `chore: release vX.Y.Z` without a scope. Making
          # scope mandatory would fail those PRs even though they follow
          # the documented contract. See also the `/build-create-pr`
          # skill which drops the scope when the change is not
          # plugin-scoped.
          if ! printf '%s\n' "$PR_TITLE" | grep -qE '^(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)(\([a-z0-9-]+\))?: .+$'; then
            echo "::error::PR title must follow conventional commits: type(scope): description  OR  type: description"
            echo "  Types: feat, fix, docs, refactor, test, chore, ci, build, perf, style, revert"
            echo "  Scope: plugin name for plugin-scoped changes; omitted for repo-wide changes (AGENTS.md § Cross-cutting changes)"
            echo "  Got: $PR_TITLE"
            exit 1
          fi

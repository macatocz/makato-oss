name: Skill Adoption Compliance Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-adoption-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.15'  # scripts require >=3.14 (see pyproject.toml)

      - name: Run Skill Adoption Audit
        run: python3 scripts/skill_adoption_audit.py

      - name: Upload compliance report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: skill-adoption-audit-report
          path: docs/skill-adoption-audit-report.md

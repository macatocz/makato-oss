name: Skill Adoption Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-adoption-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run Skill Adoption Audit
        run: python3 scripts/skill_adoption_audit.py

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: skill-adoption-audit-report
          path: docs/skill-adoption-audit-report.md

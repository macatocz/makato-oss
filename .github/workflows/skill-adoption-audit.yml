name: Skill Adoption Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-adoption-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7

      - name: Run Skill Adoption Audit
        run: python3 scripts/skill_adoption_audit.py

      - name: Upload compliance report
        uses: actions/upload-artifact@v7
        with:
          name: skill-adoption-audit-report
          path: docs/skill-adoption-audit-report.md

name: Skill Adoption Audit

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate skill adoption dashboard
        run: python3 scripts/audit_skill_adoption.py

      - name: Commit dashboard if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet docs/skill-adoption.md 2>/dev/null || (
            git add docs/skill-adoption.md &&
            git commit -m "chore: update skill adoption dashboard [skip ci]" &&
            git push
          )

      - name: Rotate skill log
        run: bash scripts/rotate-skill-log.sh

# Post-merge spec archive workflow
#
# Fires automatically after every PR merges to the default branch.
# Extracts the closed issue number from the PR body (Closes/Fixes/Resolves #N),
# then runs the archive-spec skill headless via the Claude CLI to:
#   - Merge requirements into specs/master/{domain}.md
#   - Move specs/<key>-<slug>/ to specs/archive/{date}-<key>-<slug>/
#   - Close the linked GitHub Issue
#
# Reference:
#   plugins/makato-orchestrate/skills/archive-spec/
#   plugins/makato-orchestrate/workflows/archive-spec.yml (consumer template)
name: Post-merge spec archive

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  archive:
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Claude CLI
        run: |
          echo "::notice::Replace this step with the official Claude CLI setup action."

      - name: Extract closing issue number
        id: issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          issue=$(echo "$PR_BODY" \
            | grep -ioP '(?:closes|fixes|resolves)\s+#\K\d+' \
            | head -1)
          if [ -z "$issue" ]; then
            echo "::notice::No closing issue found in PR body — skipping archive."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "issue_number=$issue" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run archive-spec
        if: steps.issue.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          claude --dangerously-skip-permissions \
            --print "Post-merge: run /makato-orchestrate:archive-spec for issue #${ISSUE_NUMBER} (merged via PR #${PR_NUMBER})" \
            --allowedTools "Bash,Read,Write,Edit"

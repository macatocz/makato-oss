# Post-merge spec archive workflow
#
# Fires automatically after every PR merges to the default branch.
# Extracts the closed issue number from the PR body (Closes/Fixes/Resolves #N),
# then runs the deterministic archive-spec.sh port (NO Claude CLI on the runner)
# to:
#   - Append an Evolution Log row to specs/master/{domain}.md
#   - Move specs/<key>-<slug>/ to specs/archive/{date}-<key>-<slug>/
#   - Close the linked GitHub Issue idempotently
#
# The archival is purely mechanical, so it needs no model — this keeps GitHub
# Actions Claude-free, consistent with the D5 "no LLM in the runner" constraint.
# Note: in this repo `specs/**` is gitignored (scratch dir), so the folder move
# is a local no-op on the runner and the durable effect is the issue closure;
# the script tolerates the absent folder and never fails on it.
#
# Reference:
#   plugins/makato-orchestrate/scripts/archive-spec.sh
#   plugins/makato-orchestrate/skills/archive-spec/
#   plugins/makato-orchestrate/workflows/archive-spec.yml (consumer template)
name: Post-merge spec archive

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  archive:
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract closing issue number
        id: issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          issue=$(echo "$PR_BODY" \
            | grep -ioP '(?:closes|fixes|resolves)\s+#\K\d+' \
            | head -1)
          if [ -z "$issue" ]; then
            echo "::notice::No closing issue found in PR body — skipping archive."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "issue_number=$issue" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run archive-spec
        if: steps.issue.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bash plugins/makato-orchestrate/scripts/archive-spec.sh \
            --issue "${ISSUE_NUMBER}" \
            --pr "${PR_NUMBER}"

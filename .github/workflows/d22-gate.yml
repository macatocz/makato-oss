name: D22 Compliance Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d22-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.15'  # scripts require >=3.15 (see pyproject.toml)

      - name: Run D22 compliance report
        run: python3 scripts/d22_compliance_report.py

      - name: Upload compliance report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: d22-compliance-report
          path: docs/d22-compliance-report.md

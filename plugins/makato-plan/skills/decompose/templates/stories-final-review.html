<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stories Final Review: {{FEATURE_NAME}}</title>
<style>
:root {
  --accent: #0070F2;
  --accent-light: #00B8F1;
  --accent-glow: rgba(0,112,242,0.15);
  --green: #34D399;
  --green-dim: rgba(52,211,153,0.12);
  --amber: #FBBF24;
  --amber-dim: rgba(251,191,36,0.12);
  --purple: #A78BFA;
  --purple-dim: rgba(167,139,250,0.12);
  --cyan: #22D3EE;
  --red: #F87171;
  --red-dim: rgba(248,113,113,0.12);
  --blue: #60A5FA;
  --blue-dim: rgba(96,165,250,0.12);

  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;

  --radius-sm: 3px;
  --radius-md: 6px;
  --radius-lg: 8px;
}
[data-theme="dark"] {
  --bg: #0A0E14;
  --surface: #111820;
  --surface-2: #1A2230;
  --surface-3: #222E3E;
  --fg: #E8EDF5;
  --muted: #7B8FA6;
  --border: #1E2A3A;
  --border-light: #2A3A4E;
  --nav-bg: rgba(10,14,20,0.92);
  --grid-line: rgba(0,112,242,0.04);
}
[data-theme="light"] {
  --bg: #F8FAFC;
  --surface: #FFFFFF;
  --surface-2: #F1F5F9;
  --surface-3: #E2E8F0;
  --fg: #0F172A;
  --muted: #64748B;
  --border: #E2E8F0;
  --border-light: #CBD5E1;
  --nav-bg: rgba(248,250,252,0.92);
  --grid-line: rgba(0,112,242,0.03);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  line-height: 1.6;
  color: var(--fg);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  transition: background .3s, color .3s;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 80px 80px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column;
}
.nav-top {
  height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
}
.nav-left { display: flex; align-items: center; gap: 12px; }
.nav-title { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--accent); }
.nav-title .prompt { color: var(--green); }
.nav-right { display: flex; align-items: center; gap: 16px; }
.theme-toggle {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 5px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 12px;
  color: var(--muted); transition: all .2s;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

/* Comments strip */
.comments-strip {
  position: fixed; bottom: 56px; left: 0; right: 0; height: 64px; z-index: 99;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 32px; gap: 8px;
  overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.comments-strip::-webkit-scrollbar { height: 4px; }
.comments-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.comments-strip-empty {
  font-family: var(--font-mono); font-size: 11px; color: var(--muted); opacity: 0.5; white-space: nowrap;
}
.comment-chip {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 8px 14px; cursor: pointer;
  transition: border-color .15s; max-width: 220px;
}
.comment-chip:hover { border-color: var(--accent); }
.comment-chip-section {
  font-family: var(--font-mono); font-size: 9px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--accent); white-space: nowrap;
}
.comment-chip-text {
  font-size: 12px; color: var(--fg); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}

/* Bottom bar */
.bottom-bar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
  background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border); display: flex; align-items: center;
  justify-content: space-between; padding: 0 32px; z-index: 100;
}
.nav-btn {
  font-family: var(--font-mono); font-size: 13px; padding: 8px 20px;
  border-radius: var(--radius-md); cursor: pointer; transition: all .15s;
  border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  display: flex; align-items: center; gap: 6px;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: #fff; border: none;
}
.nav-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,112,242,.25); }
.nav-btn:disabled { opacity: 0.3; pointer-events: none; }
.copy-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: #fff; border: none; padding: 8px 24px; font-size: 13px; font-weight: 600;
  border-radius: var(--radius-md); cursor: pointer; font-family: var(--font-mono);
  transition: all .15s; position: relative; overflow: hidden;
}
.copy-btn::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.1), transparent);
  background-size: 200% 100%; animation: shimmer 3s ease-in-out infinite;
}
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.copy-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,112,242,.25); }
.copy-status { font-family: var(--font-mono); font-size: 12px; color: var(--green); display: none; }
.bottom-center { display: flex; align-items: center; gap: 12px; }
.kbd {
  font-family: var(--font-mono); font-size: 10px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 3px; padding: 2px 5px; color: var(--muted);
}

.step-track {
  display: flex; align-items: center; justify-content: center;
  padding: 0 32px 12px; gap: 0;
}
.step-item { display: flex; align-items: center; gap: 0; cursor: pointer; }
.step-num {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border-light); background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  color: var(--muted); transition: all .25s; position: relative;
}
.step-item.current .step-num { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.step-item.done .step-num { border-color: var(--green); background: var(--green); color: #000; }
.step-item.has-comment .step-num::after {
  content: ''; position: absolute; top: -2px; right: -2px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--green); border: 2px solid var(--bg);
}
.step-label {
  font-family: var(--font-mono); font-size: 10px; color: var(--muted);
  margin-left: 6px; max-width: 0; overflow: hidden; white-space: nowrap;
  transition: max-width .3s, margin .3s, color .2s;
}
.step-item.current .step-label { max-width: 140px; color: var(--accent); margin-left: 6px; }
.step-connector { width: 24px; height: 2px; background: var(--border-light); transition: background .25s; }
.step-connector.done { background: var(--green); }

.slides-container { position: fixed; top: 92px; left: 0; right: 0; bottom: 120px; overflow: hidden; z-index: 1; }
.slide {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; opacity: 0; pointer-events: none; transition: opacity .3s; overflow-y: auto;
}
.slide.active { opacity: 1; pointer-events: all; }
.slide-content {
  width: 100%; max-width: 1400px; margin: 0 auto; padding: 40px 48px;
  display: grid; grid-template-columns: 1fr 340px; gap: 32px;
  align-content: start; min-height: 100%;
}
.slide-content.full-width { grid-template-columns: 1fr; }
.slide-main { display: flex; flex-direction: column; justify-content: flex-start; }
.slide-sidebar { display: flex; flex-direction: column; justify-content: flex-start; }

.slide-label {
  font-family: var(--font-mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--accent); margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;
}
.slide-label::before { content: '>'; color: var(--green); font-weight: 700; }
.slide-title {
  font-size: clamp(24px, 3vw, 32px); font-weight: 900;
  letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 20px;
}

/* Phase board */
.phase-board { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin: 20px 0; }
.phase-column {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px; min-height: 200px;
}
.phase-column-header {
  font-family: var(--font-mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.06em; margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
.phase-column-header.foundation { color: var(--green); border-color: var(--green); }
.phase-column-header.happy-path { color: var(--accent); border-color: var(--accent); }
.phase-column-header.edge-cases { color: var(--amber); border-color: var(--amber); }

/* Story card (mini board) */
.story-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); margin-bottom: 10px; overflow: hidden;
  transition: border-color .15s;
}
.story-card:hover { border-color: var(--accent); }
.story-card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; background: var(--surface-3); border-bottom: 1px solid var(--border);
}
.story-card-seq { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--accent); }
.story-card-sp {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  background: var(--accent-glow); color: var(--accent); padding: 2px 6px; border-radius: 3px;
}
.story-card-body { padding: 12px; }
.story-card-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.story-card-teams { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.story-card-deps { font-family: var(--font-mono); font-size: 10px; color: var(--amber); margin-top: 6px; }

/* Details metadata box */
.details-box {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); margin-bottom: 20px; overflow: hidden;
}
.details-box-header {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  padding: 10px 16px; color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.details-grid {
  display: grid; grid-template-columns: 140px 1fr; padding: 4px 0;
}
.details-row {
  display: contents;
}
.details-label {
  font-size: 12px; color: var(--muted); padding: 8px 16px;
  display: flex; align-items: center;
}
.details-value {
  font-size: 13px; color: var(--fg); padding: 8px 16px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.details-value .label-tag {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  background: var(--accent-glow); color: var(--accent);
  padding: 2px 8px; border-radius: 3px;
}
.details-value .epic-link {
  font-size: 12px; color: var(--accent);
  background: var(--accent-glow); padding: 3px 10px; border-radius: 4px;
  text-decoration: none;
}

/* DoD checklist in details */
.dod-checklist { padding: 8px 16px 12px; }
.dod-progress {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  background: var(--green-dim); color: var(--green);
  padding: 3px 8px; border-radius: 4px; margin-bottom: 8px;
}
.dod-item {
  display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; font-size: 13px;
}
.dod-checkbox {
  width: 16px; height: 16px; border: 2px solid var(--border-light);
  border-radius: 3px; flex-shrink: 0; margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
}

/* Description section header */
.desc-header {
  font-size: 15px; font-weight: 700; margin: 24px 0 12px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
}
.desc-header::before { content: '\25BE'; color: var(--muted); font-size: 10px; }

/* Story-style colored panels */
.story-panel {
  border-radius: var(--radius-md); margin-bottom: 16px; overflow: hidden;
}
.story-panel-title {
  font-size: 13px; font-weight: 700; padding: 8px 14px;
}
.story-panel-body { padding: 12px 14px; font-size: 13px; line-height: 1.7; }
.story-panel-body ul { padding-left: 1.4rem; margin: 4px 0; }
.story-panel-body li { margin: 4px 0; }

.story-panel.background { background: #f0f9ff; border: 1px solid #e0f2fe; }
.story-panel.background .story-panel-title { color: #0c4a6e; }
.story-panel.scope { background: #eff6ff; border: 1px solid #dbeafe; }
.story-panel.scope .story-panel-title { color: #1e40af; }
.story-panel.toggle { background: #faf5ff; border: 1px solid #f3e8ff; }
.story-panel.toggle .story-panel-title { color: #6b21a8; }
.story-panel.scenarios { background: #f0fdf4; border: 1px solid #dcfce7; }
.story-panel.scenarios .story-panel-title { color: #166534; }
.story-panel.solution { background: #fefce8; border: 1px solid #fef9c3; }
.story-panel.solution .story-panel-title { color: #854d0e; }
.story-panel.acceptance { background: #fff7ed; border: 1px solid #ffedd5; }
.story-panel.acceptance .story-panel-title { color: #9a3412; }
.story-panel.wiki { background: #f8fafc; border: 1px solid #f1f5f9; }
.story-panel.wiki .story-panel-title { color: #475569; }
.story-panel.oos { background: #fefefe; border: 1px solid #f5f5f5; }
.story-panel.oos .story-panel-title { color: #374151; }
.story-panel.testing { background: #ecfeff; border: 1px solid #cffafe; }
.story-panel.testing .story-panel-title { color: #155e75; }

[data-theme="dark"] .story-panel.background { background: rgba(14,165,233,0.06); border-color: rgba(14,165,233,0.15); }
[data-theme="dark"] .story-panel.background .story-panel-title { color: var(--cyan); }
[data-theme="dark"] .story-panel.scope { background: rgba(59,130,246,0.06); border-color: rgba(59,130,246,0.15); }
[data-theme="dark"] .story-panel.scope .story-panel-title { color: var(--accent-light); }
[data-theme="dark"] .story-panel.toggle { background: rgba(167,139,250,0.06); border-color: rgba(167,139,250,0.15); }
[data-theme="dark"] .story-panel.toggle .story-panel-title { color: var(--purple); }
[data-theme="dark"] .story-panel.scenarios { background: rgba(52,211,153,0.06); border-color: rgba(52,211,153,0.15); }
[data-theme="dark"] .story-panel.scenarios .story-panel-title { color: var(--green); }
[data-theme="dark"] .story-panel.solution { background: rgba(251,191,36,0.06); border-color: rgba(251,191,36,0.15); }
[data-theme="dark"] .story-panel.solution .story-panel-title { color: var(--amber); }
[data-theme="dark"] .story-panel.acceptance { background: rgba(251,146,60,0.06); border-color: rgba(251,146,60,0.12); }
[data-theme="dark"] .story-panel.acceptance .story-panel-title { color: #fb923c; }
[data-theme="dark"] .story-panel.wiki { background: var(--surface-2); border-color: var(--border); }
[data-theme="dark"] .story-panel.wiki .story-panel-title { color: var(--muted); }
[data-theme="dark"] .story-panel.oos { background: var(--surface-2); border-color: var(--border); }
[data-theme="dark"] .story-panel.oos .story-panel-title { color: var(--muted); }
[data-theme="dark"] .story-panel.testing { background: rgba(34,211,238,0.06); border-color: rgba(34,211,238,0.12); }
[data-theme="dark"] .story-panel.testing .story-panel-title { color: var(--cyan); }

/* Gherkin block */
.gherkin-block {
  font-family: var(--font-mono); font-size: 12px; line-height: 1.8;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 8px;
  white-space: pre-wrap;
}

/* Deferred field placeholder */
.deferred {
  font-style: italic; color: var(--muted); font-size: 12px;
}

/* Dependency graph */
.dep-graph {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 24px; margin: 16px 0;
  font-family: var(--font-mono); font-size: 13px; line-height: 2.2;
}
.dep-node {
  display: inline-block; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 6px 12px; margin: 4px;
}
.dep-arrow { color: var(--accent); margin: 0 8px; }

/* Stats row */
.stats-row { display: flex; gap: 16px; margin: 16px 0; flex-wrap: wrap; }
.stat-box {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 16px 20px; flex: 1; min-width: 120px;
  text-align: center;
}
.stat-value { font-family: var(--font-mono); font-size: 28px; font-weight: 900; color: var(--accent); }
.stat-label {
  font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--muted); margin-top: 4px;
}

/* Comment area */
.comment-area {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px; margin-top: 20px;
}
.comment-area label {
  font-family: var(--font-mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--muted); display: block; margin-bottom: 8px;
}
.comment-area textarea {
  width: 100%; min-height: 80px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  color: var(--fg); font-family: var(--font); font-size: 13px;
  padding: 10px 12px; resize: vertical; transition: border-color .2s;
}
.comment-area textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.comment-area textarea.has-content { border-color: var(--green); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-top">
    <div class="nav-left">
      <span class="nav-title"><span class="prompt">></span> stories-final-review</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">{{FEATURE_NAME}}</span>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()">◐ Dark</button>
    </div>
  </div>
  <div class="step-track" id="stepTrack"></div>
</nav>

<div class="slides-container" id="slidesContainer">
  <!-- Slide 1: Board Overview -->
  <div class="slide active" data-label="Board Overview">
    <div class="slide-content full-width">
      <div class="slide-main">
        <div class="slide-label">Final Review</div>
        <div class="slide-title">Story Decomposition</div>
        <div class="stats-row">
          {{STATS_HTML}}
        </div>
        <div class="phase-board">
          {{PHASE_BOARD_HTML}}
        </div>
        <div class="comment-area">
          <label>Feedback</label>
          <textarea placeholder="Overall feedback on story breakdown, phase assignments, balance..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Slides 2-N: One per story -->
  {{STORY_SLIDES_HTML}}

  <!-- Final Slide: Dependency graph & summary -->
  <div class="slide" data-label="Dependencies">
    <div class="slide-content full-width">
      <div class="slide-main">
        <div class="slide-label">Dependencies & Summary</div>
        <div class="slide-title">Dependency Graph</div>
        <div class="dep-graph">
          {{DEPENDENCY_GRAPH_HTML}}
        </div>
        <div class="stats-row">
          {{SUMMARY_STATS_HTML}}
        </div>
        <div class="comment-area">
          <label>Feedback</label>
          <textarea placeholder="Dependency concerns, missing links, phase ordering issues..."></textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Comments strip -->
<div class="comments-strip" id="comments-strip">
  <span class="comments-strip-empty">Comments will appear here as you provide feedback</span>
</div>

<div class="bottom-bar">
  <button class="nav-btn" id="prevBtn" disabled onclick="navigate(-1)">&larr; Prev <span class="kbd">&larr;</span></button>
  <div class="bottom-center">
    <button class="copy-btn" onclick="copyFeedback()">Copy All Feedback &rarr;</button>
    <span class="copy-status" id="copy-status">&check; Copied</span>
  </div>
  <button class="nav-btn primary" id="nextBtn" onclick="navigate(1)">Next &rarr; <span class="kbd" style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.2);color:#fff;">&rarr;</span></button>
</div>

<script>
const slides = document.querySelectorAll('.slide');
let current = 0;

function buildStepTrack() {
  const track = document.getElementById('stepTrack');
  track.innerHTML = '';
  slides.forEach((s, i) => {
    if (i > 0) {
      const conn = document.createElement('div');
      conn.className = 'step-connector' + (i <= current ? ' done' : '');
      conn.dataset.before = i;
      track.appendChild(conn);
    }
    const item = document.createElement('div');
    item.className = 'step-item' + (i === current ? ' current' : '') + (i < current ? ' done' : '');
    const ta = s.querySelector('textarea');
    if (ta && ta.value.trim()) item.classList.add('has-comment');
    item.innerHTML = `<div class="step-num">${i + 1}</div><span class="step-label">${s.dataset.label || ''}</span>`;
    item.onclick = () => goTo(i);
    track.appendChild(item);
  });
}

function goTo(idx) {
  if (idx < 0 || idx >= slides.length) return;
  slides[current].classList.remove('active');
  current = idx;
  slides[current].classList.add('active');
  buildStepTrack();
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === slides.length - 1;
  updateCommentsStrip();
}

function navigate(dir) { goTo(current + dir); }

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') navigate(-1);
});

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function updateCommentsStrip() {
  const strip = document.getElementById('comments-strip');
  const textareas = document.querySelectorAll('.slide textarea');
  let chips = '';
  let count = 0;
  textareas.forEach((ta) => {
    if (ta.value.trim()) {
      count++;
      const owningSlide = ta.closest('.slide');
      const slideIdx = Array.from(slides).indexOf(owningSlide);
      const label = owningSlide ? owningSlide.dataset.label : `Slide ${slideIdx+1}`;
      chips += `<div class="comment-chip" onclick="goTo(${slideIdx})">
        <span class="comment-chip-section">${label}</span>
        <span class="comment-chip-text">${escapeHtml(ta.value.trim())}</span>
      </div>`;
    }
  });
  strip.innerHTML = count === 0
    ? '<span class="comments-strip-empty">Comments will appear here as you provide feedback</span>'
    : chips;
}

document.querySelectorAll('textarea').forEach(ta => {
  ta.addEventListener('input', () => {
    ta.classList.toggle('has-content', ta.value.trim().length > 0);
    buildStepTrack();
    updateCommentsStrip();
  });
});

function toggleTheme() {
  const html = document.documentElement; const btn = document.querySelector('.theme-toggle');
  if (html.dataset.theme === 'dark') { html.dataset.theme = 'light'; btn.textContent = '◐ Light'; }
  else { html.dataset.theme = 'dark'; btn.textContent = '◐ Dark'; }
  localStorage.setItem('makato-stories-theme', html.dataset.theme);
}
const saved = localStorage.getItem('makato-stories-theme');
if (saved) { document.documentElement.dataset.theme = saved; document.querySelector('.theme-toggle').textContent = saved === 'dark' ? '◐ Dark' : '◐ Light'; }

function copyFeedback() {
  const lines = [];
  slides.forEach((s, i) => {
    const textareas = s.querySelectorAll('textarea');
    const entries = [];
    textareas.forEach(ta => {
      if (ta.value.trim()) entries.push(ta.value.trim());
    });
    if (entries.length > 0) {
      lines.push(`## ${s.dataset.label || 'Slide ' + (i+1)}`);
      lines.push(entries.join('\n\n'));
      lines.push('');
    }
  });
  let text;
  if (lines.length === 0) {
    text = '# Stories Final Review Feedback\n\n_No comments — approved as-is._\n';
  } else {
    text = `# Stories Final Review Feedback\n\n${lines.join('\n')}`;
  }
  navigator.clipboard.writeText(text).then(() => {
    const status = document.getElementById('copy-status');
    status.style.display = 'inline';
    setTimeout(() => { status.style.display = 'none'; }, 2500);
  });
}

buildStepTrack();
document.getElementById('prevBtn').disabled = true;
</script>

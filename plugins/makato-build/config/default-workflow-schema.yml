# default-workflow-schema.yml
# Built-in default workflow schema for makato-build.
#
# This file mirrors the current hardcoded pipeline sequence used by build-start.
# It is the fallback when no .claude/workflow-schema.yml is present in the repo.
#
# Format: see docs/workflow-schema.md for full field documentation.
# Issue: #563

version: "1.0"

# Model execution policy is separate from the artifact DAG below.
# OMP resolves DEFAULT/PLAN/REVIEW/COMMIT/TINY through modelRoles.default/plan/review/commit/tiny.
# Override individual fields in <repo-root>/.claude/workflow-schema.yml.
skill_execution:
  defaults:
    role: DEFAULT
    effort: inherit
  skills:
    makato-build:build-start: {role: DEFAULT, effort: inherit}
    makato-build:build-explore: {role: PLAN, effort: high}
    makato-build:build-refine: {role: PLAN, effort: high}
    makato-build:build-grill-with-docs: {role: PLAN, effort: high}
    makato-build:build-implement-tdd: {role: DEFAULT, effort: high}
    makato-build:build-implement-goal: {role: DEFAULT, effort: high}
    makato-build:build-simplify: {role: REVIEW, effort: high}
    makato-build:build-review: {role: REVIEW, effort: xhigh}
    makato-build:build-verify: {role: DEFAULT, effort: inherit}
    makato-build:build-verify-spec: {role: REVIEW, effort: high}
    makato-build:build-runtime-qa: {role: REVIEW, effort: high}
    makato-build:build-sensors: {role: TINY, effort: inherit}
    makato-build:build-resolve-finding: {role: DEFAULT, effort: high}
    makato-build:build-fix-security: {role: DEFAULT, effort: high}
    makato-build:build-fix-types: {role: DEFAULT, effort: high}
    makato-build:build-push-to-git: {role: COMMIT, effort: inherit}
    makato-build:build-create-pr: {role: COMMIT, effort: inherit}
    makato-build:build-fix-ci: {role: DEFAULT, effort: high}
    makato-build:build-coordinate-repos: {role: DEFAULT, effort: inherit}
    makato-build:build-address-pr-comments: {role: REVIEW, effort: high}
    makato-build:definition-of-done: {role: REVIEW, effort: high}
    makato-build:inject-context: {role: TINY, effort: inherit}
    makato-build:inject-skills: {role: TINY, effort: inherit}
    makato-plan:brainstorming: {role: PLAN, effort: high}
    makato-plan:create-prd: {role: PLAN, effort: high}
    makato-plan:create-architecture: {role: PLAN, effort: high}
    makato-plan:create-ux: {role: PLAN, effort: high}
    makato-plan:create-prototype: {role: PLAN, effort: high}
    makato-plan:decompose: {role: PLAN, effort: high}
    makato-plan:create-acceptance-tests: {role: PLAN, effort: medium}
    makato-plan:stress-test-artifact: {role: REVIEW, effort: xhigh}
    makato-plan:to-issues: {role: DEFAULT, effort: inherit}
    makato-plan:issue-to-project: {role: TINY, effort: inherit}
    makato-plan:manage-stores: {role: TINY, effort: inherit}
    makato-plan:excalidraw: {role: DEFAULT, effort: inherit}
    makato-plan:excalidraw-diagram-generator: {role: DEFAULT, effort: inherit}
    makato-change:orchestrate: {role: DEFAULT, effort: xhigh}
    makato-change:analyze: {role: PLAN, effort: xhigh}
    makato-change:design: {role: PLAN, effort: xhigh}
    makato-change:execute: {role: DEFAULT, effort: xhigh}
    makato-change:resolve-review: {role: REVIEW, effort: xhigh}

artifacts:
  - id: refine
    skill: build-refine
    required: true
    description: "Bridge planned story to implementation plan (tasks, file targets, test strategy)"

  - id: grill-with-docs
    skill: build-grill-with-docs
    required: false
    description: "Align implementation plan vocabulary to the codebase domain model (optional)"
    after: [refine]

  - id: implement-tdd
    skill: build-implement-tdd
    required: false
    description: "TDD inner loop: targeted RED → GREEN per task; build-verify owns whole-change gates"
    after: [refine]

  - id: implement-goal
    skill: build-implement-goal
    required: false
    description: "Goal-driven inner loop for UI, config, or migration work"
    after: [refine]

  - id: simplify
    skill: build-simplify
    required: true
    description: "Review implemented code for incidental complexity"
    after: [implement-tdd, implement-goal]

  - id: review
    skill: build-review
    required: true
    description: "Adversarial diff review against acceptance criteria"
    after: [simplify]

  - id: verify
    skill: build-verify
    required: true
    description: "Whole-change quality gates (sensors, build, lint, unit, CI-aware integration and coverage)"
    after: [review]

  - id: push-to-git
    skill: build-push-to-git
    required: true
    description: "Create atomic conventional commits and push the feature branch"
    after: [verify]

  - id: create-pr
    skill: build-create-pr
    required: true
    description: "Open pull request with AC-mapped description"
    after: [push-to-git]

  - id: address-pr-comments
    skill: build-address-pr-comments
    required: false
    description: "Classify and resolve PR review comments (runs after review feedback arrives)"
    after: [create-pr]

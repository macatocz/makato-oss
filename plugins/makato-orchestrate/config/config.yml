# config.yml — tunable parameters for loop.sh (makato-orchestrate autonomous driver).
#
# Declarative source of truth. parse-config.py reads this file and emits bash
# `NAME="${ENV:-default}"` assignments so the historical env-override contract is
# preserved byte-for-byte. Runtime-derived paths (REPO_ROOT, SPECS_DIR, STATE_DIR,
# PIDFILE) stay in loop.sh — they depend on `git`/`$HOME` and are not tunables.
#
# Schema: top-level mapping with two keys:
#   vars     list of {var, env, default, export?} entries — loop.sh tunables
#   models   mapping of role -> {base_url} — LLM endpoint routing (issue #5)
#
# Each vars entry:
#   var      bash variable name loop.sh consumes
#   env      environment variable that overrides it (omit/null = fixed value)
#   default  value used when env is unset
#   export   true = emit `export` so subprocess inherits it
#
# Each models entry:
#   base_url  LLM endpoint base URL for this role; points to the open (local)
#             endpoint at Phase-1 start. No closed-provider URL appears here —
#             the LLM-judge closed role (sequence 11) is added later.
#
# Full prose docs, per-parameter, live in config.md.

# --- Poll cadence ---
- { var: DEFAULT_INTERVAL,        env: MAKATO_LOOP_INTERVAL,          default: "300" }
- { var: DEFAULT_STATUS,          env: MAKATO_LOOP_STATUS,            default: "Ready" }
- { var: MAKATO_LOOP_ALLOW_TODO,  env: MAKATO_LOOP_ALLOW_TODO,        default: "" }

# --- Adaptive idle backoff (#516) ---
- { var: IDLE_BACKOFF_MAX,        env: MAKATO_LOOP_IDLE_MAX,          default: "1800" }
- { var: IDLE_BACKOFF_FACTOR,     env: MAKATO_LOOP_IDLE_FACTOR,       default: "2" }

# --- Assign-on-dispatch board sync (#33) ---
- { var: ASSIGN_ON_DISPATCH,      env: MAKATO_LOOP_ASSIGN_ON_DISPATCH, default: "1" }
- { var: ASSIGNEE,                env: MAKATO_LOOP_ASSIGNEE,          default: "@me" }

# --- Board CAS claim (#259) ---
- { var: CLAIM_ON_DISPATCH,       env: MAKATO_LOOP_CLAIM_ON_DISPATCH, default: "1" }

# --- Dispatch gate (#318/#355) ---
- { var: GATE_DISABLE,            env: MAKATO_LOOP_GATE_DISABLE,      default: "0" }

# --- Liveness watchdog (#164) ---
- { var: STALL_WARN_SECS,         env: MAKATO_LOOP_STALL_WARN,        default: "900" }
- { var: STALL_KILL_SECS,         env: MAKATO_LOOP_STALL_KILL,        default: "3600" }
- { var: STALL_POLL_SECS,         env: MAKATO_LOOP_STALL_POLL,        default: "60" }
- { var: STALL_TERM_GRACE_SECS,   env: MAKATO_LOOP_STALL_TERM_GRACE,  default: "30" }

# --- Stall recovery (#444) ---
- { var: STALL_THRESHOLD_SECS,    env: MAKATO_LOOP_STALL_THRESHOLD,   default: "300" }
- { var: MAX_STALL_RESTARTS,      env: MAKATO_MAX_STALL_RESTARTS,     default: "3" }
- { var: STALL_BACKOFF_BASE_SECS, env: MAKATO_STALL_BACKOFF_BASE,     default: "60" }

# --- Headless CLI resilience (#531/#532) ---
- { var: CLAUDE_CODE_RETRY_WATCHDOG, env: CLAUDE_CODE_RETRY_WATCHDOG, default: "1", export: true }
- { var: API_TIMEOUT_MS,          env: API_TIMEOUT_MS,                default: "1200000", export: true }

# --- Run-mutex force reclaim (#172) ---
- { var: FORCE_GRACE_SECS,        env: MAKATO_LOOP_FORCE_GRACE,       default: "10" }

# --- Merged/stale worktree reaper (#265/#320) ---
- { var: REAP_ON_POLL,            env: MAKATO_LOOP_REAP_ON_POLL,      default: "1" }
- { var: REAP_INTERVAL_SECS,      env: MAKATO_LOOP_REAP_INTERVAL,     default: "3600" }
- { var: REAP_STALE_AGE_SECS,     env: MAKATO_LOOP_REAP_STALE_AGE,    default: "86400" }
- { var: REAP_STALE_FORCE,        env: MAKATO_LOOP_REAP_STALE_FORCE,  default: "0" }
- { var: REAP_SPECS,              env: MAKATO_LOOP_REAP_SPECS,        default: "1" }

# --- Orphaned In-progress reconciliation (#368/#616) ---
- { var: RECONCILE_ON_POLL,       env: MAKATO_LOOP_RECONCILE_ON_POLL, default: "1" }
- { var: RECONCILE_DRYRUN,        env: MAKATO_LOOP_RECONCILE_DRYRUN,  default: "0" }
- { var: ORPHAN_STALE_SECS,       env: MAKATO_ORPHAN_STALE_SECS,      default: "3600" }
- { var: ORPHAN_DETECT_DISABLE,   env: MAKATO_ORPHAN_DETECT_DISABLE,  default: "0" }

# --- workflow-state prune pass (#597) ---
- { var: MAKATO_LOOP_PRUNE_ON_RUN, env: MAKATO_LOOP_PRUNE_ON_RUN,     default: "0" }
- { var: MAKATO_LOOP_PRUNE_AGE_DAYS, env: MAKATO_LOOP_PRUNE_AGE_DAYS, default: "30" }

# --- Sleep-wake / idempotent-dispatch guards (#171) ---
- { var: SLEEP_MAX_STEP_SECS,     env: MAKATO_LOOP_SLEEP_MAX_STEP,    default: "30" }
- { var: MIN_DISPATCH_GAP_SECS,   env: MAKATO_LOOP_MIN_DISPATCH_GAP,  default: "30" }
- { var: LAST_DISPATCH_GAP_SECS,  env: MAKATO_LOOP_LAST_DISPATCH_GAP, default: "30" }

# --- Board-poll resilience (#289) ---
- { var: POLL_RETRIES,            env: MAKATO_LOOP_POLL_RETRIES,      default: "3" }
- { var: POLL_BACKOFF_BASE_SECS,  env: MAKATO_LOOP_POLL_BACKOFF_BASE, default: "2" }

# --- GraphQL rate-limit guard (#556/#683) ---
- { var: GRAPHQL_MIN_REMAINING,   env: MAKATO_LOOP_GRAPHQL_MIN_REMAINING, default: "1000" }
- { var: RATE_GUARD,              env: MAKATO_LOOP_RATE_GUARD,        default: "1" }
- { var: RATE_SKIP_THRESHOLD,     env: MAKATO_LOOP_RATE_SKIP_THRESHOLD, default: "3" }
- { var: RATE_SKIP_BACKOFF,       env: MAKATO_LOOP_RATE_SKIP_BACKOFF, default: "600" }
- { var: BOARD_LIMIT,             env: MAKATO_LOOP_BOARD_LIMIT,       default: "500" }

# --- Critical-call REST fallback (#447) ---
- { var: FALLBACK_RETRIES,        env: MAKATO_LOOP_FALLBACK_RETRIES,  default: "2" }
- { var: FALLBACK_BACKOFF_BASE_SECS, env: MAKATO_LOOP_FALLBACK_BACKOFF_BASE, default: "2" }

# --- Promote-ready exclusion set (fixed, no env override) ---
- { var: _PROMOTE_EXCLUSION_LABELS, default: "triage experimental status:blocked autonomous:halt needs-human-review needs-reshape" }

# --- LLM-judge evaluator (issue #13 / sequence 11) ---
# Name of the Langfuse native LLM-as-a-judge evaluator that scores step outputs.
# The closed-model endpoint URL and its API key are Langfuse instance secrets — not
# stored here. The modelRole→endpoint table (routing one role to the closed endpoint)
# lands in the models: block added by issue #5.
- { var: LANGFUSE_JUDGE_EVALUATOR_NAME, env: LANGFUSE_JUDGE_EVALUATOR_NAME, default: "" }
- { var: LANGFUSE_JUDGE_SCORE_NAME,     env: LANGFUSE_JUDGE_SCORE_NAME,     default: "quality" }

# --- Open-model endpoint (issue #7) ---
# MAKATO_OPEN_ENDPOINT_URL: base URL for the cloud open-model API (e.g.
#   https://api.openai.com/v1 or an openai-compatible endpoint). When non-empty,
#   loop.sh exports it as ANTHROPIC_BASE_URL so every omp / Claude Code dispatch
#   routes through this endpoint. Empty string = use harness default (closed API).
#   Set via env: MAKATO_OPEN_ENDPOINT_URL=https://... loop.sh run
# MAKATO_OPEN_MODEL_ROLES: comma-separated list of oh-my-pi modelRole tiers that
#   should route through MAKATO_OPEN_ENDPOINT_URL. Informational in Phase 1 —
#   the roles are already wired by issue #5 frontmatter changes; this var documents
#   the expected set and can gate role-specific routing helpers added later.
- { var: MAKATO_OPEN_ENDPOINT_URL, env: MAKATO_OPEN_ENDPOINT_URL, default: "", export: true }
- { var: MAKATO_OPEN_MODEL_ROLES,  env: MAKATO_OPEN_MODEL_ROLES,  default: "sonnet,haiku,opus" }

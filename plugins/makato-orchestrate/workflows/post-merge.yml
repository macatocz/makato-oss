# Post-merge documentation workflow (GAP-012 / #35)
#
# Copy this file to .github/workflows/post-merge.yml in your consumer repo.
# It dispatches the documentation-agent once after a pull request merges to
# the default branch. The agent appends a CHANGELOG entry, conditionally
# updates README on public-API changes, closes parent and child Issues
# tracked in workflow-state, advances the Projects v2 board to Done via
# `issue-to-project sync-lifecycle`, and runs a docs-coverage retrospective.
#
# Prerequisites in the consumer repo:
#   - Claude CLI available on the runner (set up via the official action).
#   - The `gh` CLI is preinstalled on ubuntu-latest images.
#   - A `GITHUB_TOKEN` with `issues: write` and `repository-projects: write`
#     scopes (the default GITHUB_TOKEN suffices for issue closure; project
#     mutations may require a PAT — see GitHub Projects v2 docs).
#
# Reference: plugins/makato-orchestrate/agents/documentation-agent.md
name: Post-merge documentation

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: read
  repository-projects: write

jobs:
  document:
    # Only run when the PR actually merged (not just closed) and only against
    # the repository's default branch. github.event.pull_request.base.ref is
    # the target branch of the merged PR; github.event.repository.default_branch
    # is the repo's configured default. Comparing the two scopes this workflow
    # to default-branch merges only.
    # Note: expressions in job-level if: must be wrapped in ${{ }} to be
    # evaluated as context lookups rather than literal strings.
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Fetch full history so the agent can diff the merge commit against
          # its first parent if needed.
          fetch-depth: 0

      - name: Setup Claude CLI
        # The exact setup step depends on the consumer's Claude integration.
        # Replace this placeholder with the official setup action once it is
        # the consumer's chosen pattern. See
        # https://docs.anthropic.com/claude-code for current guidance.
        run: |
          echo "::notice::Replace this step with the official Claude CLI setup action."
          # Example placeholder — consumers wire their own auth:
          #   npm install -g @anthropic-ai/claude-code
          #   claude --version

      - name: Run documentation-agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          claude --prompt "Post-merge: run documentation-agent for PR #${PR_NUMBER}"

# Post-merge spec archive workflow (deterministic bash port — #221)
#
# Copy this file to .github/workflows/archive-spec.yml in your consumer repo.
# It archives completed feature specs after a pull request merges to the default
# branch: extracts the closed issue number from the PR body, then runs the
# deterministic archive-spec.sh script (NO Claude CLI on the runner) to append
# an Evolution Log row to the master spec, move the spec folder to
# specs/archive/, and close the linked GitHub Issue idempotently.
#
# Why no Claude CLI: the archival is purely mechanical (derive slug → move
# folder → append audit row → close issue). Running it as plain bash keeps
# GitHub Actions Claude-free — consistent with the D5 "no LLM in the runner"
# constraint — and avoids a per-merge cloud-LLM cost plus a new API-key secret.
#
# Prerequisites in the consumer repo:
#   - The `gh` CLI is preinstalled on ubuntu-latest images.
#   - A `GITHUB_TOKEN` with `contents: write` and `issues: write` scopes
#     (the default GITHUB_TOKEN suffices for issue closure).
#   - Spec folders follow the specs/<key>-<slug>/ (or specs/<slug>/) convention.
#   - The script lives at plugins/makato-orchestrate/scripts/archive-spec.sh
#     (vendor it into your repo, or adjust the path below to wherever you keep
#     the makato-orchestrate plugin).
#
# NOTE: if `specs/**` is gitignored in your repo (scratch dir), the folder move
# is a local no-op on the runner and the durable effect is the issue closure.
# The script tolerates the absent folder and exits 0.
#
# Mirrors: plugins/makato-orchestrate/workflows/post-merge.yml (documentation-agent)
# Reference: plugins/makato-orchestrate/skills/archive-spec/references/archive-spec-workflow.md
name: Post-merge spec archive

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  archive:
    # Only on actual merge to the default branch, not on PR close without merge.
    if: >-
      ${{ github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Extract closing issue number
        id: issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Matches: Closes #N, Fixes #N, Resolves #N (case-insensitive, first match)
          issue=$(echo "$PR_BODY" \
            | grep -ioP '(?:closes|fixes|resolves)\s+#\K\d+' \
            | head -1)
          if [ -z "$issue" ]; then
            echo "::notice::No closing issue found in PR body — skipping archive."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "issue_number=$issue" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run archive-spec
        if: steps.issue.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          bash plugins/makato-orchestrate/scripts/archive-spec.sh \
            --issue "${ISSUE_NUMBER}" \
            --pr "${PR_NUMBER}"

# Skill Bundles — makato-observability
#
# Maps changed-file path globs (plus optional content-hint predicates) to an
# ordered list of recommended skills that inject-skills prepends into an
# agent's system prompt before dispatch.
#
# Bundle names are plugin-prefixed to avoid cross-plugin collisions in the
# merged registry. No `default` bundle here — makato-build owns that.

version: "1.0"

bundles:
  # Triggered when working on the makato-observability plugin's own skill files.
  # Literal segments: plugins/makato-observability/skills → specificity ≥ 3.
  - name: observability-skills
    globs:
      - "plugins/makato-observability/skills/**/*.md"
    skills:
      - langfuse-instrument
      - langfuse-ops
      - langfuse-enrich

  # Triggered when working on Python files that set up OpenTelemetry / Langfuse.
  # Wide globs — requires contains predicate.
  # task_contains enables routing when the task description mentions observability
  # work even if no OpenTelemetry files are in the diff.
  - name: observability-otel
    globs:
      - "**/*.py"
    contains:
      - "from opentelemetry"
      - "import opentelemetry"
      - "langfuse"
      - "TracerProvider"
      - "OTLPSpanExporter"
      - "langfuse.session.id"
      - "langfuse.user.id"
      - "mask_otel_spans"
      - "create_score"
    task_contains:
      - "distributed tracing"
      - "opentelemetry"
      - "span exporter"
      - "instrument the agent"
      - "langfuse"
      - "TracerProvider"
      - "OTLP"
      - "session tracking"
      - "user feedback"
      - "token cost"
      - "mask pii"
      - "enrich traces"
      - "error analysis"
      - "judge calibration"
      - "sdk upgrade"
    skills:
      - langfuse-instrument
      - langfuse-ops
      - langfuse-enrich

# Skill Bundles — makato-core
#
# Maps changed-file path globs (plus optional content-hint predicates) to an
# ordered list of recommended skills that inject-skills prepends into an
# agent's system prompt before dispatch.
#
# Bundle names are plugin-prefixed to avoid cross-plugin collisions in the
# merged registry. No `default` bundle here — makato-build owns that.

version: "1.0"

bundles:
  # Triggered when working on the makato-core plugin's own skill files.
  # Literal segments: plugins/makato-core/skills → specificity ≥ 3.
  # (Documentation skills context7 / crafting-effective-readmes / markdown /
  # writing-clearly-and-concisely moved to makato-doc — see its skill-bundles.yml.)
  - name: core-skills
    globs:
      - "plugins/makato-core/skills/**/*.md"
    skills:
      - create-issue
      - makato-guide
      - map-codebase-context

  # Triggered when working on AGENTS.md or CLAUDE.md governance files,
  # where map-codebase-context and makato-guide apply.
  # Literal segments: plugins/ → specificity = 1; contains filter scopes to governance.
  - name: core-governance
    globs:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "plugins/*/AGENTS.md"
      - "plugins/*/CLAUDE.md"
    skills:
      - map-codebase-context
      - makato-guide

  # Triggered when editing any plugin's SKILL.md — surfaces the skill-judge
  # evaluator so authors can score quality while working on a skill.
  # Literal segments: plugins, skills, SKILL.md → narrow glob, gate-exempt.
  - name: core-skill-judge
    globs:
      - "plugins/**/skills/**/SKILL.md"
    skills:
      - skill-judge

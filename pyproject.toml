[project]
# This is the makato monorepo's own pytest harness — scoped narrowly to skill
# smoke tests and per-skill unit tests that already live inside individual
# plugin folders. It is NOT a "makato is a Python package" declaration.
#
# Rationale: each Claude Code plugin in plugins/ is the unit of distribution,
# not a Python wheel. The makato repo as a whole does not publish, install, or
# import as a single package. The harness exists so:
#
#   1. plugins/makato-build/shared/test_inject_context.py (resolver unit tests)
#      is collectable by pytest in one command.
#   2. tests/test_smoke_build_simplify.py (#64 Part B) exercises the
#      build-simplify 7-step JSONL contract against a synthetic fixture so the
#      Part A behavior (no-test-runner = degraded-confidence path, not HALT)
#      regresses on every PR.
#   3. plugins/makato-sagibeast/skills/dotx-schema-extractor/tests/* becomes
#      collectable from the repo root.
#
# Adding a test runner to plugins that don't already have one is explicitly
# OUT OF SCOPE — see #64 § *Out of scope*.
name = "makato-smoke-tests"
version = "0.0.0"
description = "Internal pytest harness for makato skill smoke tests. Not published."
requires-python = ">=3.14"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
# Discover tests in the top-level tests/ folder (Part B smoke tests) AND in any
# plugins/**/tests/ or plugins/**/shared/test_*.py site that ships with its
# own pytest-collectable tests. The dotx-schema-extractor case (sagibeast) and
# the inject_context resolver case (makato-build/shared) are both covered by
# the patterns below; new test sites under plugins/ are picked up automatically.
testpaths = [
  "tests",
  "plugins/makato-build/shared",
  "plugins/makato-observability/hooks",
  "plugins/makato-orchestrate/scripts/tests",
  "plugins/makato-sagibeast/skills/dotx-schema-extractor/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Quiet collection of stale worktree copies — `.claude/worktrees/**` carries
# in-flight branches whose test files would otherwise be double-collected.
norecursedirs = [
  ".git",
  ".claude",
  "node_modules",
  "__pycache__",
  ".pytest_cache",
]
# Make assertion introspection useful for the build-simplify smoke test, which
# asserts the full JSONL arc shape.
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]

# ---------------------------------------------------------------------------
# Ruff linter — explicit config boundary so ruff does not inherit rules from
# sibling-directory ruff.toml files when invoked from a git worktree path
# (e.g. .claude/worktrees/<worktree>). The default rule set (E, F, W) is what
# the pre-commit hook enforces; per-file-ignores suppress pre-existing debt in
# files not authored by this repo's build lane.
# ---------------------------------------------------------------------------
[tool.ruff.lint]
# Use ruff's default select (E, F, W) — deliberately minimal.
# Adding extra rules here would require fixing pre-existing debt across all
# plugin Python files, which is out of scope for the build lane.
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# langfuse_hook.py intentionally uses broad exception handling (BLE001),
# try/except/pass patterns (S110, S112), and shebang without execute bit
# (EXE001) as part of its fail-open contract. These are pre-existing patterns;
# the per-file-ignore prevents false positives when the file is staged.
"plugins/makato-observability/hooks/langfuse_hook.py" = [
  "BLE001",  # broad exception catch — intentional fail-open contract
  "S110",    # try-except-pass — intentional silent-logging fallback
  "S112",    # try-except-continue — intentional JSONL parse skip
  "EXE001",  # shebang without execute bit — hook is invoked via python3
  "PYI034",  # __enter__ return type — pre-existing FileLock implementation
  "PYI036",  # __exit__ annotation — pre-existing FileLock implementation
  "FURB162", # timezone.replace — pre-existing fromisoformat compat pattern
  "UP017",   # datetime.UTC — deferred modernisation
  "UP012",   # encode() UTF-8 — deferred modernisation
  "UP037",   # string annotations — deferred modernisation
  "RUF100",  # unused noqa — stale directive from prior ruff version
]
# Test files that use sys.path.insert before imports need E402 and import-sort
# suppression; the conditional import is intentional (path setup before hook import).
"tests/test_langfuse_hook_trace_id.py" = ["E402", "I001"]
# test_build_verify_spec.py uses conditional sys.path.insert before imports.
"plugins/makato-build/shared/test_build_verify_spec.py" = ["E402"]
# Generated test files for ported orchestrate scripts: sys.path.insert before import,
# E741 (l var name in list comprehensions), unused pytest import, unsorted imports.
"plugins/makato-orchestrate/scripts/tests/test_generate_progress.py" = ["E402", "I001"]
"plugins/makato-orchestrate/scripts/tests/test_generate_quality_doc.py" = ["E402", "I001", "E741"]
"plugins/makato-orchestrate/scripts/tests/test_emit_needs_planning_signal.py" = ["E402", "I001", "F401"]
# generate_quality_doc.py uses manual arg parsing for exit-64 parity (no argparse needed).

# oh-my-pi (omp) settings for the makato-oss open-model harness.
#
# omp v18 reads role routing and tool formatting from ~/.omp/agent/config.yml,
# separately from provider definitions in ~/.omp/agent/models.yml.
#
# modelRoles declares every canonical Makato model role (see
# tests/test_model_roles_config.py EXPECTED_ROLES), all routed to the
# checked-in local-vLLM default (local/open). infra/bootstrap-vllm.sh installs
# this file verbatim on a fresh remote Linux box and merges the qwen-vllm
# profile into the existing config.yml on re-runs.
# The legacy opus/sonnet/haiku aliases are retained so existing consumers
# that still read those Claude-tier names directly keep working — see
# tests/test_model_roles_config.py::test_omp_config_yml_maps_every_canonical_role.
#
# task.agentModelOverrides routes each makato subagent to its shared role and
# must mirror config/agent-roles.yml (enforced by
# tests/test_model_roles_config.py).
#
# To route a different provider (OpenAI, Apple/Ollama, remote Qwen) on an
# installed box, run scripts/select-model-profile.sh <profile>: it merges the
# profile from config/model-profiles.yml into the installed config instead of
# hand-editing it.
modelRoles:
  default: local/open
  task: local/open
  smol: local/open
  tiny: local/open
  plan: local/open
  advisor: local/open
  review: "@advisor" # per-skill REVIEW role; follows the configured reviewer model
  designer: local/open
  commit: local/open
  slow: local/open
  vision: local/open
  orchestrator: local/open
  # Legacy Claude-tier aliases retained for backward compatibility (issue #5).
  opus: local/open
  sonnet: local/open
  haiku: local/open

tools:
  format: qwen3

task:
  agentModelOverrides:
    coder: "@task"
    sensor-fixer: "@task"
    runtime-qa: "@task"
    diff-reviewer: "@advisor"
    gate-scout: "@smol"
    knowledge-scout: "@smol"
    plan-analyst: "@smol"
    change-implementer: "@task"
    code-reviewer: "@advisor"
    requirements-diff-analyzer: "@advisor"
    code-explorer: "@smol"
    test-analyzer: "@smol"
    quality-guard: "@smol"
    gherkin-scenario-elaborator: "@commit"
    po-agent: "@orchestrator"
    light-planner: "@plan"
    task-file-scout: "@smol"
    context-summariser: "@smol"
    documentation-agent: "@commit"
    dev-reviewer: "@advisor"
    po-reviewer: "@advisor"
    qa-reviewer: "@advisor"
    acceptance-writer: "@commit"
    doc-writer: "@commit"
    context-scout: "@smol"
    prototype-builder: "@designer"
